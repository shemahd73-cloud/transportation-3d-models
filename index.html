<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6c42d9"><title>مدينة المواصلات السحرية</title><style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800;900&display=swap');:root{--purple:#6840d9;--ink:#2b2153;--yellow:#ffd752}*{box-sizing:border-box}body{margin:0;font-family:Cairo,Tahoma,Arial,sans-serif;background:radial-gradient(circle at 20% 10%,#ffebae,transparent 35%),radial-gradient(circle at 80% 30%,#d6c9ff,transparent 35%),linear-gradient(145deg,#f7f2ff,#d9f8ff);color:var(--ink);min-height:100dvh}.wrap{max-width:1020px;margin:auto;padding:16px 18px 45px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.logo{font-weight:900;font-size:clamp(17px,4vw,25px)}.stars{background:white;border:3px solid #f6ce4e;border-radius:25px;padding:5px 16px;font-weight:900;box-shadow:0 5px 0 #e4c456}.hero{position:relative;margin-top:15px;border:6px solid white;border-radius:30px;overflow:hidden;box-shadow:0 13px 32px #6853aa30}.hero img{display:block;width:100%;height:auto;max-height:none;object-fit:contain}.hero:after{content:'';position:absolute;inset:auto 0 0;height:40%;background:linear-gradient(transparent,#281d5a9c);pointer-events:none}.hero-title{position:absolute;z-index:1;bottom:12px;right:18px;color:white;text-shadow:0 3px 8px #28214b;font-size:clamp(17px,4vw,30px);font-weight:900}.lead{text-align:center;font-size:clamp(17px,3vw,24px);font-weight:900;margin:22px 0 15px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:15px}.vehicle{border:4px solid white;background:white;border-radius:24px;padding:8px 8px 14px;box-shadow:0 8px 0 #cfc3ec,0 12px 22px #6b5e9830;cursor:pointer;transition:transform .15s;min-width:0}.vehicle:active,.primary:active{transform:translateY(4px)}.vehicle img{width:100%;aspect-ratio:1.3;object-fit:cover;border-radius:16px}.vehicle strong{display:block;margin-top:8px;font-size:17px}.vehicle small{color:#755cb2}.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:30px}.primary,.secondary{border:0;border-radius:22px;padding:14px 24px;font:900 18px Cairo,Tahoma,sans-serif;cursor:pointer;box-shadow:0 7px 0 #b99628}.primary{background:#ffd64e;color:#49315a}.secondary{background:#8058e4;color:white;box-shadow:0 7px 0 #5233a9}.page{display:none}.page.active{display:block;animation:pop .3s ease}@keyframes pop{from{opacity:.5;transform:translateY(10px)}to{opacity:1;transform:none}}.panel{background:#ffffffed;border:5px solid white;border-radius:30px;padding:clamp(14px,4vw,30px);box-shadow:0 15px 40px #6757a52b;margin-top:20px;text-align:center}.panel h1{font-size:clamp(23px,5vw,37px);margin:8px 0 14px}.vid{width:100%;max-width:680px;aspect-ratio:16/9;object-fit:contain;display:block;margin:15px auto;background:#19172c;border-radius:20px;box-shadow:0 9px 24px #0002}.vehiclepic{width:min(100%,340px);border-radius:22px}.quizOptions{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:12px;margin:22px auto;max-width:800px}.quizOption{border:4px solid #e5dafa;border-radius:20px;background:#fff;cursor:pointer;padding:7px;font:800 16px Cairo,Tahoma}.quizOption img{width:100%;aspect-ratio:1.3;object-fit:cover;border-radius:13px}.quizOption.correct{border-color:#2bc884;background:#e3fff2}.quizOption.wrong{border-color:#f66d8a;background:#fff0f3}.question{font-size:clamp(20px,4vw,27px);font-weight:900}.feedback{min-height:44px;font-weight:900;font-size:20px}.progress{font-weight:800;color:#7652c7}.hidden{display:none!important}.foot{text-align:center;margin:24px;color:#786c9d;font-size:12px}.arbox{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}.arbox input{border:2px solid #cab8ff;border-radius:14px;padding:12px;min-width:220px;flex:1;font-size:14px;max-width:480px;direction:ltr}.arbox button{font:800 15px Cairo;background:#ebe2ff;border:0;border-radius:14px;padding:10px 16px;cursor:pointer}@media(max-width:460px){.wrap{padding:12px 12px 32px}.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.vehicle{border-width:3px}.vehicle strong{font-size:15px}.vehicle small{font-size:12px}.hero{border-radius:22px}.quizOptions{grid-template-columns:repeat(2,minmax(0,1fr))}.primary,.secondary{padding:11px 15px;font-size:15px}.panel{border-radius:22px}.top .logo{font-size:16px}}
</style></head><body><main class="wrap"><header class="top"><div class="logo">🌈 مدينة المواصلات السحرية</div><div class="stars">⭐ <span id="score">0</span></div></header><section id="home" class="page active"><div class="hero"><img src="assets/home.png" alt="مدينة المواصلات الملوّنة"><div class="hero-title">🚦 انطلق في مغامرتك!</div></div><p class="lead">✨ اختر مركبة واكتشف حكايتها ✨</p><div id="vehicles" class="cards"></div><div class="actions"><button class="primary" onclick="startQuiz()">🎯 ابدأ تحدي المواصلات</button><button class="secondary" onclick="openAr()">🌟 اكتشف المواصلات بالواقع المعزز</button></div></section><section id="watch" class="page"><div class="panel"><h1 id="vtitle"></h1><p>🎬 شاهد المركبة وهي تتحدث!</p><video id="player" class="vid" controls playsinline preload="metadata"></video><div class="actions"><button class="primary" onclick="show('home')">🏡 العودة للمدينة</button><button class="secondary" onclick="startQuiz()">🎯 العب التحدي</button></div></div></section><section id="quiz" class="page"><div class="panel"><div class="progress" id="progress"></div><h1>🎯 تحدي المواصلات</h1><div class="question" id="question"></div><div class="quizOptions" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><button class="primary hidden" id="next" onclick="nextQuestion()">السؤال التالي ←</button><div class="actions"><button class="secondary" onclick="show('home')">🏡 العودة للمدينة</button></div></div></section><section id="done" class="page"><div class="panel"><h1>🏆 بطل المواصلات!</h1><p style="font-size:clamp(22px,5vw,36px)">🎉 أحسنت! أكملت الرحلة 🎉</p><p id="result" style="font-size:22px;font-weight:900"></p><div class="actions"><button class="primary" onclick="startQuiz()">🔁 العب مرة أخرى</button><button class="secondary" onclick="show('home')">🏡 العودة للمدينة</button></div></div></section><div class="foot">صُنعت بحب للأطفال الصغار ✨</div></main><script>
const data=[{id:'bus',name:'الحافلة المدرسية',emoji:'🚌',line:'تأخذ الأطفال إلى المدرسة'},{id:'ambulance',name:'سيارة الإسعاف',emoji:'🚑',line:'تساعد المرضى وتنقلهم للمستشفى'},{id:'fire',name:'سيارة الإطفاء',emoji:'🚒',line:'يساعد رجال الإطفاء في إخماد الحرائق'},{id:'car',name:'السيارة الحمراء',emoji:'🚗',line:'تنقلنا إلى الأماكن المختلفة'},{id:'motorcycle',name:'الدراجة النارية',emoji:'🏍️',line:'مركبة تسير على عجلتين'}];const questions=[['ما المركبة التي تنقل الأطفال إلى المدرسة؟','bus'],['ما المركبة التي تساعد المرضى؟','ambulance'],['ما المركبة التي يستخدمها رجال الإطفاء؟','fire'],['ما المركبة الحمراء الصغيرة التي تسير على أربع عجلات؟','car'],['ما المركبة التي تسير على عجلتين؟','motorcycle'],['أي مركبة نركبها للذهاب مع زملائنا إلى المدرسة؟','bus']];let index=0,points=0,answered=false;
let audioCtx;
function sound(type='tap'){
 try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audioCtx=audioCtx||new AC();if(audioCtx.state==='suspended')audioCtx.resume();const t=audioCtx.currentTime;const tones=type==='correct'?[523,659,784,1047]:type==='wrong'?[392,330]:type==='finish'?[523,659,784,1047,1318]:[660];tones.forEach((freq,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type==='wrong'?'sine':'triangle';o.frequency.setValueAtTime(freq,t+i*.105);g.gain.setValueAtTime(.0001,t+i*.105);g.gain.exponentialRampToValueAtTime(.11,t+i*.105+.015);g.gain.exponentialRampToValueAtTime(.0001,t+i*.105+.15);o.connect(g);g.connect(audioCtx.destination);o.start(t+i*.105);o.stop(t+i*.105+.16)})}catch(e){}
}
document.addEventListener('click',e=>{if(e.target.closest('button')&&!e.target.closest('.quizOption'))sound('tap')});const $=id=>document.getElementById(id);$('vehicles').innerHTML=data.map(v=>`<button class="vehicle" onclick="watch('${v.id}')"><img src="assets/${v.id}.png" alt="${v.name}"><strong>${v.emoji} ${v.name}</strong><small>اضغط لتشاهدني 🎬</small></button>`).join('');function show(id){$('player').pause();document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id===id));window.scrollTo({top:0,behavior:'instant'})}function watch(id){const v=data.find(x=>x.id===id);$('vtitle').textContent=v.emoji+' '+v.name;$('player').src=`assets/${id}.mp4`;show('watch');$('player').load()}function startQuiz(){index=0;points=0;$('score').textContent=0;show('quiz');renderQuestion()}function renderQuestion(){answered=false;const q=questions[index];$('progress').textContent=`السؤال ${index+1} من ${questions.length}`;$('question').textContent=q[0];$('feedback').textContent='';$('next').classList.add('hidden');$('next').textContent=index===questions.length-1?'شاهد النتيجة 🏆':'السؤال التالي ←';let opts=[...data].sort(()=>Math.random()-.5);$('options').innerHTML=opts.map(v=>`<button class="quizOption" data-id="${v.id}" onclick="answer('${v.id}')"><img src="assets/${v.id}.png" alt="${v.name}"><span>${v.name}</span></button>`).join('')}function answer(id){if(answered)return;answered=true;let correct=questions[index][1];document.querySelectorAll('.quizOption').forEach(b=>{b.disabled=true;if(b.dataset.id===correct)b.classList.add('correct');if(b.dataset.id===id&&id!==correct)b.classList.add('wrong')});if(id===correct){sound('correct');points++;$('score').textContent=points;$('feedback').textContent='🌟 رائع! إجابة صحيحة!'}else{sound('wrong');$('feedback').textContent='💛 محاولة جميلة! الإجابة الصحيحة ملوّنة بالأخضر'}$('next').classList.remove('hidden')}function nextQuestion(){index++;if(index<questions.length){renderQuestion()}else{$('result').textContent=`جمعت ${points} من ${questions.length} نجوم ⭐`;show('done');sound('finish')}}function openAr(){window.open('https://share.gemini.google/zYH9FnTgfpPY','_blank','noopener,noreferrer')}
</script></body></html>
